<div class="page">
  <div class="page__header">
    <div>
      <h1>Wells</h1>
      <p class="text-secondary">Manage wells and the clients that own them.</p>
    </div>
    <app-button (clicked)="onCreate()" icon="+">New Well</app-button>
  </div>

  <div class="page__toolbar">
    <input
      type="search"
      class="form-control"
      placeholder="Search wells…"
      [value]="searchTerm"
      (input)="onSearch($any($event.target).value)"
    />
  </div>

  <app-data-table
    [columns]="columns"
    [rows]="($any(wells$ | async) || [])"
    [loading]="(loading$ | async) || false"
    [total]="(total$ | async) || 0"
    [page]="page"
    [pageSize]="pageSize"
    [sortBy]="sortBy"
    [sortDir]="sortDir"
    emptyMessage="No wells found."
    (sortChange)="onSort($event)"
    (pageChange)="onPage($event)"
    (edit)="onEdit($event)"
    (delete)="onDelete($event)"
    (rowClick)="onEdit($event)"
  ></app-data-table>

  <app-confirm-dialog
    [open]="confirmOpen"
    title="Delete Well"
    [message]="'Delete ' + (pendingDelete?.name || 'this well') + '? This cannot be undone.'"
    confirmText="Delete"
    [destructive]="true"
    (confirmed)="confirmDelete()"
    (cancelled)="cancelDelete()"
  ></app-confirm-dialog>
</div>
